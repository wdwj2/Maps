<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Maps</title>
<style>
  /* =========================================================
     색상 — 여기 값만 바꿔도 전체 분위기가 바뀝니다
     ========================================================= */
  :root {
    --surface:  #ffffff;
    --ink:      #111111;   /* 기본 글자 */
    --sub:      #7a7a7a;   /* 보조 글자 */
    --line:     #e6e6e6;   /* 테두리·구분선 */
    --primary:  #111111;   /* 포인트 (블랙) */
    --tint:     #efefef;   /* 선택된 탭 배경 */
    --origin:   #111111;   /* 출발 점 */
    --dest:     #111111;   /* 목적지 핀 */
    --shadow:   0 1px 2px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #f3f3f3; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", "Apple SD Gothic Neo", sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  .app {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ---------- 지도 ---------- */
  #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; background: #f3f3f3; }
  .mm { overflow: hidden; touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; }
  .mm:active { cursor: grabbing; }
  .mm-tiles { position: absolute; top: 0; right: 0; bottom: 0; left: 0; filter: grayscale(1) brightness(1.03) contrast(.92); }
  .mm-tile { position: absolute; left: 0; top: 0; width: 256px; height: 256px; transform-origin: 0 0;
    opacity: 0; transition: opacity .25s; pointer-events: none; -webkit-user-drag: none; }
  .mm-tile.ok { opacity: 1; }
  .mm-base { position: absolute; left: 0; top: 0; pointer-events: none; }
  .mm-base svg { display: block; width: 100%; height: 100%; }
  /* 자세한 지도 가장자리를 부드럽게 흐려서 넓은 지도와 자연스럽게 이어지게 */
  .mm-base.detail {
    -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent), linear-gradient(to bottom, transparent, #000 7%, #000 93%, transparent);
    -webkit-mask-composite: source-in; mask-composite: intersect;
    mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent), linear-gradient(to bottom, transparent, #000 7%, #000 93%, transparent);
  }
  .mm-markers { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; }
  .mm-marker { position: absolute; left: 0; top: 0; will-change: transform; }
  .mm-attrib {
    position: absolute; right: 0; bottom: calc(var(--safe-bottom) + 72px); z-index: 3;
    font-size: 9px; color: #999; background: rgba(255,255,255,.7); padding: 1px 6px; pointer-events: none;
  }
  .map-note {
    position: absolute; z-index: 400; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 13px; color: var(--sub); text-align: center; line-height: 1.6; display: none;
  }

  /* 지도 글자 */
  .area {
    display: inline-block; transform: translate(-50%, -50%); white-space: nowrap;
    font-size: 9.5px; font-weight: 500; color: #9a9a9a; letter-spacing: .14em; text-transform: uppercase;
    text-shadow: 0 0 2px #fff, 0 0 3px #fff, 0 0 4px #fff;
  }
  .hide-areas .area { display: none; }
  .road { display: inline-block; white-space: nowrap; font-size: 10px; color: #8d8d8d; letter-spacing: .02em;
    text-shadow: 0 0 2px #fff, 0 0 3px #fff, 0 0 4px #fff; }
  .poi { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .poi-icon {
    flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #fff;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .poi-label { font-size: 12px; font-weight: 500; letter-spacing: -.05px; text-shadow: 0 0 2px #fff, 0 0 3px #fff, 0 0 4px #fff; }

  /* ---------- 경로 카드 ---------- */
  .route {
    position: absolute; z-index: 500;
    top: calc(var(--safe-top) + 10px); left: 12px; right: 12px;
    background: var(--surface); border-radius: 14px; box-shadow: var(--shadow);
    display: grid; grid-template-columns: 44px 1fr; padding: 8px 10px 8px 0; row-gap: 8px;
  }
  .rail { grid-row: 1 / 3; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 14px 0 12px; }
  .rail .o { width: 18px; height: 18px; border-radius: 50%; background: #ececec; display: flex; align-items: center; justify-content: center; }
  .rail .o::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--origin); }
  .rail .dots { display: flex; flex-direction: column; gap: 3px; }
  .rail .dots i { width: 2.5px; height: 2.5px; border-radius: 50%; background: #b5b5b5; display: block; }
  .field {
    height: 42px; border: 1px solid var(--line); border-radius: 10px;
    display: flex; align-items: center; padding: 0 6px 0 12px; font-size: 15px; letter-spacing: -.1px;
    transition: border-color .2s, box-shadow .2s;
  }
  .field-o { color: var(--ink); }
  .field-d:focus-within { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .field-d input {
    flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent;
    font: inherit; color: var(--ink); -webkit-appearance: none; appearance: none; border-radius: 0;
  }
  .field-d input::placeholder { color: var(--sub); }
  .field-d input::-webkit-search-cancel-button { display: none; }
  .go {
    flex: none; width: 30px; height: 30px; border-radius: 8px; border: 0; cursor: pointer; background: transparent;
    display: flex; align-items: center; justify-content: center; transition: background .2s;
  }
  .route.typing .go { background: var(--primary); }
  .route.typing .go path { stroke: #fff; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }

  /* ---------- 지도 버튼 ---------- */
  .fab {
    position: absolute; z-index: 500; right: 14px; border: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow);
    transition: transform .15s, opacity .25s;
  }
  .fab:active { transform: scale(.94); }
  .fab-center { width: 50px; height: 50px; border-radius: 14px; background: var(--surface); bottom: calc(var(--safe-bottom) + 152px); }
  .fab-street { width: 56px; height: 56px; border-radius: 16px; background: var(--primary); bottom: calc(var(--safe-bottom) + 86px); }
  .sheet-open .fab { opacity: 0; pointer-events: none; }

  /* ---------- 하단 탭 (휴대폰) ---------- */
  .nav {
    position: absolute; z-index: 600; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 8px 0 calc(var(--safe-bottom) + 6px);
    display: flex; justify-content: space-around;
  }
  .tab {
    width: 33%; background: none; border: 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 12px; color: var(--sub);
  }
  .tab .pill { width: 60px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; transition: background .2s; }
  .tab svg { stroke: var(--sub); }
  .tab.on { color: var(--ink); font-weight: 600; }
  .tab.on .pill { background: var(--tint); }
  .tab.on svg { stroke: var(--primary); }

  /* ---------- 저장 목록 ---------- */
  .sheet {
    position: absolute; z-index: 550; left: 0; right: 0; bottom: 0;
    max-height: 74%; overflow-y: auto;
    padding: 8px 0 calc(var(--safe-bottom) + 84px);
    background: var(--surface); border-radius: 20px 20px 0 0;
    box-shadow: 0 -2px 12px rgba(0,0,0,.08);
    transform: translateY(105%); transition: transform .36s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.open { transform: translateY(0); }
  @media (max-width: 899px) { .sheet { max-height: 90%; } }
  .sheet-handle { width: 32px; height: 4px; border-radius: 2px; background: #d5d7da; margin: 0 auto 12px; }
  .sheet-head { padding: 4px 20px 12px; display: flex; align-items: center; justify-content: space-between; }
  .sheet-head h2 { font-size: 21px; font-weight: 600; letter-spacing: -.3px; }
  .sheet-close { display: none; width: 36px; height: 36px; border: 0; border-radius: 50%; background: none; cursor: pointer; align-items: center; justify-content: center; }
  .sheet-close:hover { background: #f1f3f4; }
  .sheet-sub { padding: 0 20px 8px; font-size: 13px; font-weight: 600; color: var(--sub); letter-spacing: .02em; }
  .list { list-style: none; }
  .list li { display: flex; align-items: center; gap: 14px; padding: 10px 20px; cursor: pointer; transition: background .15s; }
  .list li:hover, .list li:active { background: #f5f6f7; }
  .date {
    flex: none; width: 46px; height: 46px; border-radius: 12px; background: #fff; border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
  }
  .date b { font-size: 16px; font-weight: 600; color: var(--primary); }
  .date small { font-size: 8.5px; font-weight: 600; color: var(--sub); letter-spacing: .08em; margin-top: 3px; }
  .li-text { flex: 1; min-width: 0; }
  .li-title { font-size: 16px; font-weight: 500; letter-spacing: -.2px; }
  .li-meta { margin-top: 3px; font-size: 13px; color: var(--sub); display: flex; align-items: center; gap: 4px; }
  .li-more { flex: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; opacity: .45; }

  /* ---------- 내 리뷰 ---------- */
  .section-gap { height: 8px; background: #f4f4f4; margin: 14px 0 16px; }
  .reviews { list-style: none; }
  .review { padding: 4px 20px 22px; }
  .review + .review { border-top: 1px solid var(--line); padding-top: 20px; }
  .rv-head { display: flex; align-items: center; gap: 12px; }
  .avatar {
    flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500;
  }
  .rv-who { flex: 1; min-width: 0; }
  .rv-place { font-size: 15.5px; font-weight: 600; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rv-count { font-size: 12.5px; color: var(--sub); margin-top: 2px; }
  .rv-rate { display: flex; align-items: center; gap: 10px; margin: 12px 0 8px; }
  .stars { display: flex; gap: 2px; }
  .stars svg { display: block; }
  .rv-time { font-size: 11.5px; color: var(--sub); background: #f1f1f1; padding: 3px 8px; border-radius: 6px; }
  .rv-text { font-size: 15px; line-height: 1.5; letter-spacing: -.1px; white-space: pre-line; }
  .photos { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 4px; margin-top: 14px; border-radius: 14px; overflow: hidden; }
  .photos.one { grid-template-columns: 1fr; }
  .photo {
    height: 0; padding-top: 110%; background: #eee center / cover no-repeat;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; pointer-events: none;
  }
  .photos.one .photo { padding-top: 62.5%; }
  .rv-foot { display: flex; align-items: center; gap: 4px; margin-top: 10px; }
  .like {
    width: 32px; height: 32px; margin-left: -7px; border: 0; border-radius: 50%; background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background .15s;
  }
  @media (hover: hover) { .like:hover { background: #f3f3f3; } }
  .like svg path { fill: none; stroke: var(--ink); stroke-width: 2; transition: fill .15s; }
  .like.on svg path { fill: var(--ink); }
  .like.pop svg { animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .like-count { font-size: 12.5px; font-weight: 500; color: var(--ink); min-width: 1ch; font-variant-numeric: tabular-nums; }

  /* ---------- 전체 화면 ---------- */
  .screen { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 2000; opacity: 0; visibility: hidden; transition: opacity .35s, visibility .35s; }
  .screen.open { opacity: 1; visibility: visible; }
  .screen:not(.open) { pointer-events: none; }  /* 닫히는 중인 화면이 터치를 가로채지 않게 */

  #roadview { background: #000; }
  #rvVideo { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .rv-close {
    position: absolute; z-index: 5; top: calc(var(--safe-top) + 12px); left: 12px;
    width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0,0,0,.35); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
  }

  #loading { transition: opacity .5s ease, visibility .5s; }
  #loading { background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  .spinner { position: relative; width: 32px; height: 32px; animation: spin 1s steps(12) infinite; }
  .spinner i { position: absolute; left: 50%; top: 0; width: 2.5px; height: 9px; margin-left: -1.25px; border-radius: 2px; background: var(--ink); transform-origin: 50% 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; letter-spacing: .02em; color: var(--ink); }

  /* 검색 사진 (화면 꽉 채움) */
  #photoView { background: #000; }
  #photoImg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; pointer-events: none; }

  /* 하얗게 사라졌다 첫 화면으로 */
  #whiteout { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 3000; background: #fff; opacity: 0; pointer-events: none;
    transition: opacity var(--fade-ms, 1600ms) ease-in-out; }
  #whiteout.on { opacity: 1; pointer-events: auto; }

  /* 경로 안내 팝업 (운명) */
  #guide { background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .guide-card {
    min-width: 168px; max-width: 74vw; padding: 15px 20px; border-radius: 12px; background: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,.3); text-align: center;
  }
  .guide-text { font-size: 13.5px; font-weight: 400; letter-spacing: -.1px; color: var(--ink); }
  /* 팝업: 아래에서 살짝 올라오며 페이드인 */
  .guide-card { opacity: 0; }
  #guide.open .guide-card { animation: rise .42s cubic-bezier(.22,.9,.3,1) .38s both; }  /* 배경이 깔린 뒤 살짝 늦게 */
  #guide { transition: opacity .5s ease, visibility .5s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }

  .toast {
    position: absolute; left: 50%; top: calc(var(--safe-top) + 132px); z-index: 1500;
    transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
    background: #111; color: #fff; padding: 11px 16px; border-radius: 10px; font-size: 13.5px;
    box-shadow: 0 4px 12px rgba(0,0,0,.2); transition: all .25s; white-space: nowrap;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  /* =========================================================
     PC 화면 (가로 900px 이상)
     ========================================================= */
  @media (min-width: 900px) {
    /* 왼쪽 세로 메뉴 */
    .nav {
      top: 0; bottom: 0; left: 0; right: auto; width: 76px;
      flex-direction: column; justify-content: flex-start; gap: 6px;
      padding: 16px 0; border-top: 0; border-right: 1px solid var(--line);
    }
    .tab { width: 100%; padding: 6px 0; font-size: 11.5px; }
    .tab .pill { width: 52px; height: 32px; }
    .tab:hover .pill { background: #f1f3f4; }
    .tab.on:hover .pill { background: var(--tint); }

    #map { left: 76px; }
    .mm-attrib { bottom: 0; }

    .route { top: 16px; left: 92px; right: auto; width: 392px;; transition: left .36s cubic-bezier(.2,.8,.2,1); }
    .sheet-open .route { left: 500px; }
    .toast { left: calc(50% + 38px); top: 24px; }

    .fab { right: 20px; }
    .fab-center { bottom: 96px; width: 44px; height: 44px; border-radius: 12px; }
    .fab-street { bottom: 28px; width: 56px; height: 56px; }
    .fab:hover { filter: brightness(.97); }
    .sheet-open .fab { opacity: 1; pointer-events: auto; }

    /* 저장 목록 → 왼쪽 패널 */
    .sheet {
      top: 0; bottom: 0; left: 76px; right: auto; width: 408px; max-height: none;
      border-radius: 0; padding: 16px 0 24px;
      box-shadow: 2px 0 10px rgba(0,0,0,.08);
      transform: translateX(-105%);
    }
    .sheet.open { transform: translateX(0); }
    .sheet-handle { display: none; }
    .sheet-close { display: flex; }
    .sheet-head { padding: 4px 16px 14px 24px; }
    .sheet-sub, .list li { padding-left: 24px; padding-right: 20px; }

    /* 로드뷰: 세로 영상을 잘리지 않게 가운데에 */
    #rvVideo { object-fit: contain; }
    /* 검색 사진: 위아래 꽉 차게, 비율 유지 (양옆은 검은 여백) */
    #photoImg { width: auto; height: 100%; max-width: 100%; margin: auto; object-fit: contain; }
    .rv-close { top: 20px; left: 20px; }
    .rv-close:hover { background: rgba(255,255,255,.18); }

    .tt-top { padding: 14px 24px 14px 16px; }
    .tt-body { top: 69px; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div id="map"></div>
  <div class="map-note" id="mapNote">Map couldn't load.<br>Open this page from its web address.</div>

  <!-- 경로 카드 -->
  <form class="route" id="route" autocomplete="off">
    <div class="rail">
      <span class="o"></span>
      <span class="dots"><i></i><i></i><i></i></span>
      <svg width="16" height="20" viewBox="0 0 24 30"><path d="M12 2a9 9 0 0 0-9 9c0 6.4 9 17 9 17s9-10.6 9-17a9 9 0 0 0-9-9Z" fill="none" stroke="#111" stroke-width="2.4"/><circle cx="12" cy="11" r="3" fill="#111"/></svg>
    </div>
    <div class="field field-o">Your location</div>
    <label class="field field-d">
      <input type="search" id="dest" placeholder="Choose destination" enterkeyhint="go" aria-label="Destination">
      <button type="submit" class="go" aria-label="Go">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="#7a7a7a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </label>
  </form>

  <!-- 지도 버튼 -->
  <button class="fab fab-center" id="centerBtn" aria-label="Recenter">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="m15.2 8.8-1.9 4.5-4.5 1.9 1.9-4.5 4.5-1.9Z" fill="#111111"/></svg>
  </button>
  <button class="fab fab-street" id="streetBtn" aria-label="Street View">
    <svg width="22" height="28" viewBox="0 0 24 30" fill="#fff"><circle cx="12" cy="4.6" r="3.4"/><path d="M8.3 10h7.4a2.3 2.3 0 0 1 2.3 2.3V19h-2.2v9h-7.6v-9H6v-6.7A2.3 2.3 0 0 1 8.3 10Z"/></svg>
  </button>

  <!-- 저장 목록 -->
  <section class="sheet" id="savedSheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2>Saved</h2>
      <button class="sheet-close" id="sheetClose" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="#111111" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-sub">Your lists</div>
    <ul class="list" id="savedList"></ul>
    <div class="section-gap"></div>
    <div class="sheet-sub">Your reviews</div>
    <ul class="reviews" id="reviewList"></ul>
  </section>

  <!-- 탭 (휴대폰: 아래 / PC: 왼쪽) -->
  <nav class="nav">
    <button class="tab on" data-tab="explore">
      <span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21s-7-7.2-7-12a7 7 0 0 1 14 0c0 4.8-7 12-7 12Z"/><circle cx="12" cy="9" r="2.3"/></svg></span>
      Explore
    </button>
    <button class="tab" data-tab="saved">
      <span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round"><path d="M6.5 3.5h11v17l-5.5-3.6-5.5 3.6v-17Z"/></svg></span>
      Saved

/* =========================================================
   지도 — 외부 프로그램 없이 직접 그리는 지도
   (지도 그림 서버가 하나 막히면 다음 서버로 자동 전환)
   ========================================================= */
const TILE_SOURCES = [
  (z, x, y, r) => `https://${'abcd'[(x + y) % 4]}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/${z}/${x}/${y}${r}.png`,
  (z, x, y, r) => `https://${'abcd'[(x + y) % 4]}.basemaps.cartocdn.com/light_nolabels/${z}/${x}/${y}${r}.png`,
  (z, x, y)    => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/${z}/${y}/${x}`,
  (z, x, y)    => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`,
];
const TILE = 256;
const RETINA = (window.devicePixelRatio || 1) > 1 ? '@2x' : '';
const project = (lat, lng, z) => {
  const s = TILE * Math.pow(2, z), sin = Math.sin(Math.max(-85, Math.min(85, lat)) * Math.PI / 180);
  return { x: (lng + 180) / 360 * s, y: (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * s };
};
const unproject = (x, y, z) => {
  const s = TILE * Math.pow(2, z), n = Math.PI - 2 * Math.PI * y / s;
  return [180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))), x / s * 360 - 180];
};

class MiniMap {
  constructor(el, o) {
    this.el = el; this.c = o.center.slice(); this.z = o.zoom; this.minZ = o.minZoom; this.maxZ = o.maxZoom;
    this.tiles = new Map(); this.markers = []; this.handlers = {}; this.loaded = 0; this.failed = 0; this.useTiles = !!o.tiles;
    el.classList.add('mm');
    this.tilePane = Object.assign(document.createElement('div'), { className: 'mm-tiles' });
    this.markerPane = Object.assign(document.createElement('div'), { className: 'mm-markers' });
    el.append(this.tilePane, this.markerPane);
    if (this.useTiles) el.append(Object.assign(document.createElement('div'), { className: 'mm-attrib', innerHTML: '&copy; OpenStreetMap &copy; CARTO' }));
    this.bind();
    addEventListener('resize', () => this.render());
    this.render();

  }
  on(ev, fn) { (this.handlers[ev] = this.handlers[ev] || []).push(fn); }
  fire(ev) { (this.handlers[ev] || []).forEach(f => f()); }
  getZoom() { return this.z; }
  // 그려 둔 지도가 화면을 항상 꽉 채우도록 최소 확대 단계를 계산
  coverZ() {
    if (!this.bounds) return this.minZ;
    const b = this.bounds, tl = project(b.n, b.w, 0), br = project(b.s, b.e, 0);
    return Math.max(Math.log2(this.el.clientWidth / (br.x - tl.x)), Math.log2(this.el.clientHeight / (br.y - tl.y)));
  }
  clampZ(z) { return Math.max(this.minZ, this.coverZ(), Math.min(this.maxZ, z)); }
  setView(c, z) { this.c = c.slice(); this.z = this.clampZ(z); this.render(); this.fire('zoomend'); }
  flyTo(c, z, opt = {}) {
    const ms = (opt.duration || .8) * 1000, c0 = this.c.slice(), z0 = this.z, t0 = performance.now();
    cancelAnimationFrame(this.anim);
    const step = now => {
      const t = Math.min(1, (now - t0) / ms), e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      this.c = [c0[0] + (c[0] - c0[0]) * e, c0[1] + (c[1] - c0[1]) * e];
      this.z = z0 + (z - z0) * e; this.render();
      if (t < 1) this.anim = requestAnimationFrame(step); else this.fire('zoomend');
    };
    this.anim = requestAnimationFrame(step);
  }
  // 사이트 안에 그려 둔 지도(SVG)를 실제 위치에 맞춰 깔기
  //   fromZ: 이 확대 단계부터 보임 (자세한 지도는 확대했을 때만 보이게)
  addBase(svg, b, opt = {}) {
    const el = Object.assign(document.createElement('div'), { className: 'mm-base' + (opt.cls ? ' ' + opt.cls : ''), innerHTML: svg });
    this.bases = this.bases || [];
    this.bases.push({ el, b, fromZ: opt.fromZ == null ? -99 : opt.fromZ });
    this.el.insertBefore(el, this.markerPane);
    if (opt.limits) this.bounds = b;
    this.z = this.clampZ(this.z); this.render();
  }
  clampCenter() {
    if (!this.bounds) return;
    const b = this.bounds, w = this.el.clientWidth, h = this.el.clientHeight;
    const tl = project(b.n, b.w, this.z), br = project(b.s, b.e, this.z), cp = project(this.c[0], this.c[1], this.z);
    const minX = tl.x + Math.min(w / 2, (br.x - tl.x) / 2), maxX = br.x - Math.min(w / 2, (br.x - tl.x) / 2);
    const minY = tl.y + Math.min(h / 2, (br.y - tl.y) / 2), maxY = br.y - Math.min(h / 2, (br.y - tl.y) / 2);
    const x = Math.max(minX, Math.min(maxX, cp.x)), y = Math.max(minY, Math.min(maxY, cp.y));
    if (x !== cp.x || y !== cp.y) this.c = unproject(x, y, this.z);
  }
  addMarker(ll, html, ax = 0, ay = 0, minZ = -99, maxZ = 99) {
    const el = Object.assign(document.createElement('div'), { className: 'mm-marker', innerHTML: html });
    this.markerPane.appendChild(el); this.markers.push({ ll, el, ax, ay, minZ, maxZ }); this.render();
  }
  // 화면 위 한 점을 고정한 채로 확대/축소
  zoomAround(z, px, py) {
    z = this.clampZ(z);
    const w = this.el.clientWidth, h = this.el.clientHeight, cp = project(this.c[0], this.c[1], this.z);
    const ll = unproject(cp.x + px - w / 2, cp.y + py - h / 2, this.z);
    const np = project(ll[0], ll[1], z);
    this.z = z; this.c = unproject(np.x - (px - w / 2), np.y - (py - h / 2), z);
    this.schedule();
  }
  panBy(dx, dy) {
    const cp = project(this.c[0], this.c[1], this.z);
    this.c = unproject(cp.x - dx, cp.y - dy, this.z); this.schedule();
  }
  schedule() { if (!this.raf) this.raf = requestAnimationFrame(() => { this.raf = 0; this.render(); }); }
  makeTile(z, x, y) {
    const n2 = Math.pow(2, z), wx = ((x % n2) + n2) % n2, img = new Image();
    img.className = 'mm-tile'; img.alt = ''; img.draggable = false;
    let n = 0;
    img.onload = () => { img.classList.add('ok'); this.loaded++; document.getElementById('mapNote').style.display = 'none'; this.render(); };
    img.onerror = () => { n++; if (n < TILE_SOURCES.length) img.src = TILE_SOURCES[n](z, wx, y, RETINA); else this.failed++; };
    img.src = TILE_SOURCES[0](z, wx, y, RETINA);
    this.tilePane.appendChild(img);
    const t = { img, z, x, y }; this.tiles.set(`${z}/${x}/${y}`, t); return t;
  }
  render() {
    const w = this.el.clientWidth, h = this.el.clientHeight;
    if (!w || !h) return;
    if (this.bounds) this.z = this.clampZ(this.z);
    this.clampCenter();
    for (const base of (this.bases || [])) {
      const b = base.b, c0 = project(this.c[0], this.c[1], this.z), tl = project(b.n, b.w, this.z), br = project(b.s, b.e, this.z);
      const st = base.el.style, op = Math.max(0, Math.min(1, (this.z - base.fromZ) / 0.35 + 0.5));
      st.opacity = op; st.visibility = op > 0 ? 'visible' : 'hidden';
      st.transform = `translate(${tl.x - c0.x + w / 2}px,${tl.y - c0.y + h / 2}px)`;
      st.width = (br.x - tl.x) + 'px'; st.height = (br.y - tl.y) + 'px';
    }
    if (!this.useTiles) { this.placeMarkers(w, h); return; }
    const zi = Math.round(this.clampZ(this.z)), n2 = Math.pow(2, zi);
    const place = t => {
      const s = Math.pow(2, this.z - t.z), cp = project(this.c[0], this.c[1], t.z);
      t.img.style.transform = `translate(${(t.x * TILE - cp.x) * s + w / 2}px,${(t.y * TILE - cp.y) * s + h / 2}px) scale(${s * 1.002})`;
    };
    const s = Math.pow(2, this.z - zi), cp = project(this.c[0], this.c[1], zi);
    const x0 = Math.floor((cp.x - w / 2 / s) / TILE), x1 = Math.floor((cp.x + w / 2 / s) / TILE);
    const y0 = Math.max(0, Math.floor((cp.y - h / 2 / s) / TILE)), y1 = Math.min(n2 - 1, Math.floor((cp.y + h / 2 / s) / TILE));
    const need = new Set(); let allReady = true;
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
      const k = `${zi}/${x}/${y}`; need.add(k);
      const t = this.tiles.get(k) || this.makeTile(zi, x, y);
      t.img.style.zIndex = 2; place(t);
      if (!t.img.classList.contains('ok')) allReady = false;
    }
    for (const [k, t] of this.tiles) {
      if (need.has(k)) continue;
      // 다른 확대 단계의 그림은 새 그림이 다 뜰 때까지 밑에 깔아 둠 (깜빡임 방지)
      if (t.z !== zi && !allReady && Math.abs(t.z - zi) <= 2) { t.img.style.zIndex = 1; place(t); continue; }
      t.img.remove(); this.tiles.delete(k);
    }
    this.placeMarkers(w, h);
  }
  placeMarkers(w, h) {
    const cz = project(this.c[0], this.c[1], this.z);
    for (const m of this.markers) {
      const show = this.z >= m.minZ && this.z < m.maxZ;
      m.el.style.display = show ? '' : 'none';
      if (!show) continue;
      const p = project(m.ll[0], m.ll[1], this.z);
      m.el.style.transform = `translate(${Math.round(p.x - cz.x + w / 2 - m.ax)}px,${Math.round(p.y - cz.y + h / 2 - m.ay)}px)`;
    }
  }
  bind() {
    const el = this.el, pts = new Map(); let last = null, pinch = null, moved = false, zoomTimer;
    const endZoom = () => { clearTimeout(zoomTimer); zoomTimer = setTimeout(() => this.fire('zoomend'), 150); };
    const rel = e => { const r = el.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    el.addEventListener('pointerdown', e => {
      cancelAnimationFrame(this.anim);
      pts.set(e.pointerId, rel(e)); if (el.setPointerCapture) el.setPointerCapture(e.pointerId); moved = false;
      if (pts.size === 1) last = rel(e);
      if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: this.z };
      }
    });
    el.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      const p = rel(e); pts.set(e.pointerId, p);
      if (pts.size === 1 && last) { this.panBy(p[0] - last[0], p[1] - last[1]); last = p; moved = true; }
      else if (pts.size === 2 && pinch) {
        const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        if (pinch.mid) this.panBy(mid[0] - pinch.mid[0], mid[1] - pinch.mid[1]);
        pinch.mid = mid;
        this.zoomAround(pinch.z + Math.log2(d / pinch.d), mid[0], mid[1]); moved = true;
      }
    });
    const up = e => {
      pts.delete(e.pointerId);
      if (pinch && pts.size < 2) { pinch = null; endZoom(); }
      last = pts.size === 1 ? [...pts.values()][0] : null;
    };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('wheel', e => {
      e.preventDefault();
      const [x, y] = rel(e);
      this.zoomAround(this.z - e.deltaY * (e.ctrlKey ? 0.01 : 0.0025), x, y); endZoom();
    }, { passive: false });
    el.addEventListener('dblclick', e => {
      const [x, y] = rel(e), z0 = this.z;
      let k = 0; const tick = () => { k++; this.zoomAround(z0 + k / 10, x, y); if (k < 10) requestAnimationFrame(tick); else endZoom(); };
      requestAnimationFrame(tick);
    });
  }
}

    ['Sowol-ro', 37.55051, 126.98247, 62],
    ['Huam-ro', 37.54955, 126.97679, 84],
    ['Hangang-daero', 37.5479, 126.97161, -87],
    ['Samil-daero', 37.5479, 126.99801, 62],
    ['Noksapyeong-daero', 37.54859, 126.98579, 70],
  ].forEach(([n, lat, lng, deg]) => map.addMarker([lat, lng], `<span class="road" style="transform:translate(-50%,-50%) rotate(${deg}deg)">${n}</span>`, 0, 0, DZ));

  // 장소 (모두 같은 크기)
  const ICON = {
    sight:   { bg: '#2b2b2b', c: '#333333', svg: '<svg width="11" height="11" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="5"/></svg>' },
    shop:    { bg: '#2b2b2b', c: '#333333', svg: '<svg width="11" height="11" viewBox="0 0 24 24" fill="#fff"><path d="M3 4h2l2.5 11h11L21 7H7"/><circle cx="9" cy="20" r="2"/><circle cx="17" cy="20" r="2"/></svg>' },
    museum:  { bg: '#2b2b2b', c: '#333333', svg: '<svg width="11" height="11" viewBox="0 0 24 24" fill="#fff"><path d="M12 2 2 7h20L12 2ZM4 9h3v9H4zm6.5 0h3v9h-3zM17 9h3v9h-3zM2 20h20v2H2z"/></svg>' },
    park:    { bg: '#8a8a8a', c: '#7a7a7a', svg: '<svg width="11" height="11" viewBox="0 0 24 24" fill="#fff"><path d="M12 2 5 12h4l-4 6h6v4h2v-4h6l-4-6h4L12 2Z"/></svg>' },
    station: { bg: '#2b2b2b', c: '#333333', svg: '<svg width="11" height="11" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="3" width="12" height="14" rx="3"/><path d="M8 21l2-3h4l2 3" stroke="#fff" stroke-width="2" fill="none"/></svg>' },
  };
  [
    ['N Seoul Tower', 37.5512, 126.98819, 'sight', -99],
    ['Namsan Park', 37.5523, 126.99172, 'park'],
    ['Baekbeom Square', 37.55497, 126.97871, 'park'],
    ['Korean Forest Garden', 37.54227, 126.9939, 'park'],
    ['Seoul Station', 37.5547, 126.9707, 'station', -99],
    ['Namdaemun Market', 37.5596, 126.97711, 'shop', -99],
    ['Sinheung Market', 37.54495, 126.98484, 'shop'],
    ['Namsan Cable Car', 37.55679, 126.98369, 'sight'],
    ['National Theater', 37.55292, 127.00038, 'museum'],
    ['Gyeongbokgung Palace', 37.57878, 126.97666, 'museum', -99],
    ['Bukchon Hanok Village', 37.58098, 126.98464, 'sight', -99],
    ['Naksan Fortress Wall', 37.57755, 127.00843, 'sight', -99],
    ['Cheonggyecheon', 37.56899, 126.97826, 'park', -99],
    ['DDP', 37.56581, 127.0092, 'museum', -99],
    ['National Museum of Korea', 37.5247, 126.98017, 'museum', -99],
    ['War Memorial of Korea', 37.53669, 126.97666, 'museum', -99],
    ['Leeum Museum of Art', 37.5384, 126.99912, 'museum', -99],
    ['Garosu-gil', 37.51882, 127.02356, 'sight', -99],
    ['Seoul Forest', 37.54378, 127.05067, 'park', -99],
    ['Ttukseom Hangang Park', 37.52984, 127.06152, 'park', -99],
  ].forEach(([n, lat, lng, t, minZ]) => {
    const ic = ICON[t];
    map.addMarker([lat, lng],
      `<div class="poi"><span class="poi-icon" style="background:${ic.bg}">${ic.svg}</span><span class="poi-label" style="color:${ic.c}">${n}</span></div>`, 11, 11, minZ == null ? DZ : minZ);
  });
}
initMap();

/* =========================================================
   동작
   ========================================================= */
const $ = id => document.getElementById(id);
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
$('centerBtn').onclick = () => map && map.flyTo(CONFIG.center, map.clampZ(CONFIG.zoom), { duration: .8 });

// 로딩 아이콘 살대 12개
$('spinner').innerHTML = Array.from({ length: 12 }, (_, i) =>
  `<i style="transform:rotate(${i * 30}deg);opacity:${(1 - ((12 - i) % 12) * 0.075).toFixed(3)}"></i>`).join('');

// 저장 목록
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
$('savedList').innerHTML = CONFIG.savedLists.map(l => {
  const [m, d] = l.date.split('/').map(Number);
  return `<li>
    <div class="date"><b>${d}</b><small>${MONTHS[m - 1]}</small></div>
    <div class="li-text">
      <div class="li-title">${l.title}</div>
      <div class="li-meta">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="2.2"><path d="M6.5 3.5h11v17l-5.5-3.6-5.5 3.6v-17Z"/></svg>
        ${l.places} ${l.places === 1 ? 'place' : 'places'}
      </div>
    </div>
    <span class="li-more"><svg width="18" height="18" viewBox="0 0 24 24" fill="#111111"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></span>
  </li>`;
}).join('');

// 내 리뷰
const star = on => `<svg width="17" height="17" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8Z" fill="${on ? '#111' : '#dcdcdc'}"/></svg>`;
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('reviewList').innerHTML = CONFIG.reviews.map(r => `
  <li class="review">
    <div class="rv-head">
      <div class="avatar">${esc(r.place.trim().charAt(0).toUpperCase())}</div>
      <div class="rv-who">
        <div class="rv-place">${esc(r.place)}</div>
        <div class="rv-count">${r.photos.length} ${r.photos.length === 1 ? 'photo' : 'photos'}</div>
      </div>
    </div>
    <div class="rv-rate">
      <div class="stars">${[1,2,3,4,5].map(i => star(i <= r.stars)).join('')}</div>
    </div>
    <div class="rv-text">${esc(r.text)}</div>
    ${r.photos.length ? `<div class="photos ${r.photos.length === 1 ? 'one' : ''}">
      ${r.photos.slice(0, 2).map(src => `<div class="photo" style="background-image:url('${src}')"></div>`).join('')}
    </div>` : ''}
    <div class="rv-foot">
      <button class="like" data-id="${esc(r.id)}" aria-label="Like" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.7 1.1 5 2.9 1.3-1.8 3-2.9 5-2.9 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2Z" stroke-linejoin="round"/></svg>
      </button>
      <span class="like-count" data-count="${esc(r.id)}">0</span>
    </div>
  </li>`).join('');
/* ---------- 좋아요 (각자 자기 화면에만 저장) ---------- */
const likes = {
  mine: (() => { try { return JSON.parse(localStorage.getItem('myLikes') || '{}'); } catch (e) { return {}; } })(),
  save() { try { localStorage.setItem('myLikes', JSON.stringify(this.mine)); } catch (e) {} },
  render(id) {
    const on = !!this.mine[id];
    document.querySelectorAll(`[data-count="${id}"]`).forEach(el => el.textContent = on ? 1 : 0);
    document.querySelectorAll(`.like[data-id="${id}"]`).forEach(b => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
  },
  toggle(id) {
    if (this.mine[id]) delete this.mine[id]; else this.mine[id] = 1;
    this.save(); this.render(id);
  },
  init() { CONFIG.reviews.forEach(r => this.render(r.id)); },
};
$('reviewList').addEventListener('click', e => {
  const b = e.target.closest('.like');
  if (!b) return;
  likes.toggle(b.dataset.id);
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
});
likes.init();

// 사진 길게 눌러 저장·확대 막기
$('reviewList').addEventListener('contextmenu', e => e.preventDefault());

function setTab(name) {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.tab === name));
  const open = name === 'saved';
  $('savedSheet').classList.toggle('open', open);
  $('savedSheet').setAttribute('aria-hidden', String(!open));
  $('app').classList.toggle('sheet-open', open);
  if (open) { $('savedSheet').scrollTop = 0; fitSheet(); }
}
// 휴대폰: 처음 열릴 때 일정 목록까지만 보이게 (스크롤하면 리뷰)
function fitSheet() {
  const sh = $('savedSheet');
  if (innerWidth >= 900) { sh.style.height = ''; return; }
  const gapTop = sh.querySelector('.section-gap').offsetTop;
  const navH = document.querySelector('.nav').offsetHeight;
  sh.style.height = Math.min(gapTop + navH + 4, innerHeight * 0.9) + 'px';
}
window.addEventListener('resize', () => { if ($('savedSheet').classList.contains('open')) fitSheet(); });
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  const name = t.dataset.tab;
  setTab(name === 'saved' && t.classList.contains('on') ? 'explore' : name);  // 한 번 더 누르면 닫힘
});
$('sheetClose').onclick = () => setTab('explore');
$('map').addEventListener('pointerdown', () => {
  if ($('savedSheet').classList.contains('open') && innerWidth < 900) setTab('explore');
});

// 목적지 입력
$('dest').addEventListener('input', e => $('route').classList.toggle('typing', e.target.value.trim() !== ''));
const norm = t => t.replace(/\s+/g, '').toLowerCase();
function runLoading(ms, then, afterFade) {
  $('toast').classList.remove('show');
  openScreen('loading');
  setTimeout(() => {
    if (afterFade) {                      // 로딩이 사라지면서 어두운 배경이 겹쳐 나타나고, 팝업이 이어서 올라옴
      then();
      closeScreen('loading');
    } else {
      then(); setTimeout(() => closeScreen('loading'), 300);
    }
  }, ms);
}
$('route').addEventListener('submit', e => {
  e.preventDefault();
  const input = $('dest');
  const key = norm(input.value);
  if (!key) { input.focus(); return; }

  if (CONFIG.destiny.words.map(norm).includes(key)) {
    input.blur();
    runLoading(CONFIG.destiny.loadingMs, startGuide, true);
    return;
  }
  const hit = CONFIG.searchPhotos.find(p => p.words.map(norm).includes(key));
  if (hit) {
    input.blur();
    $('photoImg').src = hit.src;
    runLoading(CONFIG.photoLoadingMs, () => openScreen('photoView'));
    return;
  }
  const f = $('route');
  f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
  toast("This isn't the route you're looking for.");
});

// 운명: 안내 팝업 → 터치 시 두 번째 팝업 → 이후 아무 반응 없음
let guideStep = 0;
function startGuide() {
  guideStep = 0;
  $('guideText').textContent = CONFIG.destiny.messages[0];
  openScreen('guide');
}
let fading = false;
$('guide').addEventListener('click', () => {
  if (fading) return;
  if (guideStep >= CONFIG.destiny.messages.length - 1) { fadeToStart(); return; }   // 마지막 팝업 → 첫 화면으로
  guideStep++;
  $('guideText').textContent = CONFIG.destiny.messages[guideStep];
  const card = document.querySelector('.guide-card');      // 두 번째 팝업도 같은 모션으로
  card.style.animation = 'none'; void card.offsetWidth; card.style.animation = 'rise .42s cubic-bezier(.22,.9,.3,1) both';
});
// 하얗게 천천히 사라졌다가 첫 화면으로 천천히 돌아옴
function fadeToStart() {
  fading = true;
  const w = $('whiteout'), ms = CONFIG.destiny.fadeMs;
  w.style.setProperty('--fade-ms', ms + 'ms');
  w.classList.add('on');
  setTimeout(() => {
    // 첫 화면 상태로 되돌리기
    ['guide', 'photoView', 'roadview', 'loading'].forEach(closeScreen);
    $('guide').style.transition = 'none';
    $('dest').value = ''; $('route').classList.remove('typing');
    setTab('explore');
    if (map) map.setView(CONFIG.center, map.clampZ(CONFIG.zoom));
    setTimeout(() => {
      $('guide').style.transition = '';
      w.classList.remove('on');
      setTimeout(() => { fading = false; }, ms);
    }, 250);
  }, ms + 100);
}

// 뒤로가기 후 다시 들어와도 첫 화면으로
window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

function openScreen(id) { const s = $(id); s.classList.add('open'); s.setAttribute('aria-hidden', 'false'); }
function closeScreen(id) { const s = $(id); s.classList.remove('open'); s.setAttribute('aria-hidden', 'true'); }
$('photoClose').onclick = () => closeScreen('photoView');

// 로드뷰 (영상)
const video = $('rvVideo');
$('streetBtn').onclick = () => {
  openScreen('roadview');
  video.muted = true;
  video.currentTime = 0;
  const p = video.play(); if (p) p.catch(() => {});
};
$('rvClose').onclick = () => { closeScreen('roadview'); video.pause(); };
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('roadview').classList.contains('open')) $('rvClose').onclick();
  else if ($('photoView').classList.contains('open')) closeScreen('photoView');
  else if ($('savedSheet').classList.contains('open')) setTab('explore');
});
</script>
</body>
</html>
